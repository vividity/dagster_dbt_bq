version: 2

models:
  - name: stg_customers
    description: "One row per customer, cleaned from the raw_customers seed."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: "One row per order."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "FK to stg_customers."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']

  - name: stg_payments
    description: "One row per payment. Multiple payments can belong to one order."
    columns:
      - name: payment_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: amount_usd
        description: "Payment amount in USD (raw data is in cents)."
