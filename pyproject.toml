[project]
name = "dagster_dbt_bq"
version = "0.1.0"
description = "Dagster-orchestrated dbt transformations on Google BigQuery"
# dagster-dbt does not support 3.14, and the host interpreter here is 3.14 —
# which is why everything runs in Docker against the pinned 3.12 image.
requires-python = ">=3.12,<3.14"
dependencies = [
    "dagster==1.13.19",
    "dagster-dbt==0.29.19",
    "dagster-postgres==0.29.19",
    # dagster-dbt 0.29.19 requires dbt-core<1.12. Do not bump dbt past 1.11.x
    # without bumping dagster-dbt in the same commit.
    "dbt-core==1.11.14",
    "dbt-bigquery==1.11.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.19",
    "dagster-webserver==1.13.19",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_dbt_bq"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_dbt_bq"
# Without this, dg infers the code location name from the working directory
# (/opt/dagster/app -> "app") and warns on every definitions load.
code_location_name = "dagster_dbt_bq.definitions"
registry_modules = [
    "dagster_dbt_bq.components.*",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dagster_dbt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
